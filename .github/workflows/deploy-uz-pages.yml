# Builds the Uzbek translation of angular.dev (adev) and deploys it to GitHub Pages.
# This workflow belongs to the Ilyoskhuja/angular-uz fork only; upstream workflows are untouched.

name: Deploy Uzbek docs to GitHub Pages

on:
  push:
    branches: [uzbek-doc]
    paths:
      - 'adev/**'
      - '.github/workflows/deploy-uz-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free runner disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: Add swap space
        # The final `ng build` of adev (chunk optimization + static prerender) needs more than the
        # 16 GB a standard runner has; without swap the runner kills the job near the end.
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          free -m | head -3
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@05f294094d7b9377f3b545673098aefb904962f3 # main
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@05f294094d7b9377f3b545673098aefb904962f3 # main
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Build adev (production)
        # Standard GitHub runners (4 vCPU / 16 GB) OOM with Bazel's defaults, so cap the JVM,
        # the number of parallel actions and the RAM Bazel believes it may use.
        run: |
          pnpm bazel --host_jvm_args=-Xmx2g build //adev:build.production \
            --jobs=2 \
            --local_resources=memory=8192 \
            --local_resources=cpu=3 \
            --show_progress_rate_limit=30
          df -h / | tail -1
      - name: Prepare site for GitHub Pages
        env:
          # Set repository variable ADEV_BASE_HREF to "/" once a custom domain (e.g. angular.uz) is attached.
          # Default serves from https://<owner>.github.io/angular-uz/
          BASE_HREF: ${{ vars.ADEV_BASE_HREF || '/angular-uz/' }}
        run: |
          set -euo pipefail
          SRC=dist/bin/adev/dist/browser
          OUT=$RUNNER_TEMP/site
          mkdir -p "$OUT"
          cp -RL "$SRC"/. "$OUT"/
          chmod -R u+w "$OUT"
          if [ "$BASE_HREF" != "/" ]; then
            # Match <base href="/">, <base href="/"/> and <base href="/" /> (the CLI minifies the tag).
            find "$OUT" -name '*.html' -exec sed -i -E "s|<base href=\"/\" ?/?>|<base href=\"$BASE_HREF\">|" {} +
            echo "rewritten: $(grep -l "<base href=\"$BASE_HREF\">" -r "$OUT" --include='*.html' | wc -l) html files"
            grep -o '<base[^>]*>' "$OUT/index.html"
          fi
          # SPA fallback for client-side routes on GitHub Pages
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          echo "site size: $(du -sh "$OUT" | cut -f1)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
